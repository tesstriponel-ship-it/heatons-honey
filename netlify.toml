[build]
  publish = "site"
  functions = "netlify/functions"

# Netlify's "pretty URLs" rewrites links in the HTML and breaks some of them
# (it re-quotes attributes in a way Safari can't read), so it's turned off.
[build.processing.html]
  pretty_urls = false

[functions]
  node_bundler = "esbuild"

# Keep the price list fresh, and stop browsers caching an old one.
[[headers]]
  for = "/shop.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
