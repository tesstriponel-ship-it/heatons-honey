<p style="margin: 0; font-size: 16px; line-height: 1.85; color: #4A453B; font-size: 18px; max-width: 66ch">Heatons Honey is a small, local operation in Stockport's Heatons: Moor, Chapel, Mersey and Norris. Honey and candles, sold by the Master Beekeeper and collected in person.</p>
