<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — Heatons Honey</title>
<meta name="description" content="Raw honey and hand-poured candles from hives in Heaton Moor, Stockport. Order online and collect in person.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400&amp;family=Cormorant+Garamond:ital,wght@1,400&amp;family=Work+Sans:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;background:#FAF8F3}
a{color:#2A2722}a:hover{color:#8A6A1F}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2A2722;outline-offset:3px}
button{font:inherit;color:inherit}
button:disabled{cursor:not-allowed;opacity:.35}
input::placeholder{color:#8F887A}
.hh-btn-dark,.hh-btn-line,.hh-btn-ghost,.hh-btn-plus,.hh-btn-text{transition:background-color .2s ease,color .2s ease,border-color .2s ease,opacity .2s ease}
.hh-btn-dark:hover:not(:disabled){background:#4A453B !important}
.hh-btn-line:hover:not(:disabled){background:#2A2722 !important;color:#FAF8F3 !important}
.hh-btn-ghost:hover:not(:disabled):not([aria-pressed="true"]){background:#EFE8D6 !important}
.hh-btn-plus:hover{background:#2A2722 !important;color:#FAF8F3 !important;border-color:#2A2722 !important}
.hh-btn-text:hover:not(:disabled){opacity:.6}
.hh-pop{animation:hhPop .28s ease}
@keyframes hhPop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hh-btn-dark,.hh-btn-line,.hh-btn-ghost,.hh-btn-plus,.hh-btn-text{transition:none}.hh-pop{animation:none}}
.hh-day{transition:background-color .2s ease,border-color .2s ease}
.hh-day:disabled{opacity:1 !important;cursor:default !important}
.hh-day:hover:not(:disabled):not([aria-pressed="true"]){background:#F3EAD3 !important}
@media (max-width:760px){
.hh-m-autoh{height:auto !important}
.hh-m-fullw{width:auto !important;max-width:100% !important}
.hh-m-px{padding-left:20px !important;padding-right:20px !important}
.hh-m-py{padding-top:56px !important;padding-bottom:64px !important}
.hh-m-gap{gap:40px !important}
.hh-m-grid2{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:32px 14px !important}
.hh-m-first{order:-1}
.hh-m-jar{width:min(60%,230px) !important}
.hh-m-hero{padding-top:8px !important;padding-bottom:64px !important}
.hh-m-pad{padding:24px 20px !important}
.hh-m-stack{flex-direction:column !important;align-items:flex-start !important;gap:16px !important}
}
</style>
<style>#app:empty{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<template id="view">
<div style="font-family: 'Work Sans', system-ui, sans-serif; font-weight: 300; color: #2A2722; background: #FAF8F3; min-height: 100%">

<header style="border-bottom: 1px solid #E4DED1">
<div class="hh-m-px" style="max-width: 1160px; margin: 0 auto; padding: 24px 40px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap">
<a href="index.html" aria-label="Heatons Honey, back to home" style="display: block; color: #2A2722">
<svg viewBox="-10 38 642 372" width="90" height="52" role="img" aria-label="Heatons Honey" fill="none" stroke="currentColor" stroke-width="14" stroke-linejoin="miter" stroke-miterlimit="2"><path d="M0 50V390M90 50V390M0 220H90"/><path d="M180 100H120V200H180M120 150H170"/><path d="M198 200L236 100L274 200M211 166H261"/><path d="M292 100H362M327 100V200"/><path d="M420 88L460.0 119.0V181.0L420 212L380.0 181.0V119.0Z"/><path d="M478 200V100L542 200V100"/><path d="M620 116C612 104 600 100 590 100C572 100 562 110 562 124C562 140 576 146 591 150C606 154 620 160 620 176C620 191 608 200 590 200C576 200 566 194 560 184"/><path d="M180 230L240.0 272.5V357.5L180 400L120.0 357.5V272.5Z"/><path d="M283 390V240L363 390V240"/><path d="M482 240H406V390H482M406 315H474"/><path d="M526 240L574 315L622 240M574 315V390"/></svg>
</a>
<a href="index.html" style="display: inline-flex; align-items: center; min-height: 44px; font-family: 'Josefin Sans', sans-serif; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; text-decoration: none">Back to the shop</a>
</div>
</header>

<main>
<section class="hh-m-px hh-m-py" aria-labelledby="done-title" style="max-width: 640px; margin: 0 auto; padding: 120px 40px 144px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center">
<svg width="44" height="48" viewBox="0 0 36 40" aria-hidden="true"><path d="M9 2H27L34 20L27 38H9L2 20Z" fill="none" stroke="#2A2722" stroke-width="0.9"/><path d="M12 20.5l4 4 8-9" fill="none" stroke="#2A2722" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h1 id="done-title" style="margin: 8px 0 0; font-family: 'Josefin Sans', sans-serif; font-weight: 300; font-size: 34px; line-height: 1.2; letter-spacing: 0.12em; text-transform: uppercase">Thank you</h1>
<sc-if value="{{ hasOrder }}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 16px; line-height: 1.8; color: #4A453B; max-width: 44ch">Your order will be ready on <span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.2em; color: #2A2722">{{ dateLong }}, {{ slot }}</span>. Square has emailed your receipt, which has your collection details.</p>
<dl style="margin: 24px 0 0; width: 100%; border-top: 1px solid #E4DED1; font-size: 15px; text-align: left">
<sc-for list="{{ lines }}" as="l" hint-placeholder-count="2">
<div style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #E4DED1"><dt style="color: #6E675B">{{ l.qty }} × {{ l.name }}</dt><dd style="margin: 0">{{ l.total }}</dd></div>
</sc-for>
<div style="display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #E4DED1"><dt style="color: #6E675B">Collect from</dt><dd style="margin: 0">{{ postcode }}</dd></div>
</dl>
</sc-if>
<sc-if value="{{ noOrder }}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 16px; line-height: 1.8; color: #4A453B; max-width: 44ch">Your payment went through and Square has emailed your receipt with your collection day.</p>
</sc-if>
<p style="margin: 8px 0 0; font-size: 14px; color: #6E675B">Can't make it? Call or text <a href="tel:07814854517">07814 854 517</a>.</p>
<div style="display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; align-items: center; margin-top: 12px">
<sc-if value="{{ hasOrder }}" hint-placeholder-val="{{ true }}">
<button class="hh-btn-line" type="button" onClick="{{ addToCalendar }}" style="min-height: 52px; padding: 0 30px; background: transparent; border: 1px solid #2A2722; cursor: pointer; font-family: 'Josefin Sans', sans-serif; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase">Add to calendar</button>
</sc-if>
<a href="index.html" style="min-height: 44px; display: inline-flex; align-items: center; font-family: 'Josefin Sans', sans-serif; font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase">Back to the shop</a>
</div>
</section>
</main>
</div>
</template>
<noscript><p style="font-family:sans-serif;padding:40px">Please turn on JavaScript to order from Heatons Honey.</p></noscript>
<script src="js/dc-lite.js"></script>
<script src="js/shop.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let o = null;
    try { o = JSON.parse(localStorage.getItem('hh-last-order') || 'null'); } catch (e) {}
    this.order = o && o.date && o.start ? o : null;
    if (this.order) HH.clear();
  }
  addToCalendar() {
    const o = this.order, start = HH.ukTime(o.date, o.start);
    const end = new Date(start.getTime() + (HH.shop.collection.slotMinutes || 60) * 60000);
    const z = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Heatons Honey//Order//EN', 'BEGIN:VEVENT',
      'UID:' + z(start) + '-' + Math.random().toString(36).slice(2) + '@heatonshoney', 'DTSTAMP:' + z(new Date()),
      'DTSTART:' + z(start), 'DTEND:' + z(end), 'SUMMARY:Collect Heatons Honey order',
      'LOCATION:' + HH.shop.collection.postcode, 'DESCRIPTION:Questions? Call or text 07814 854 517',
      'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = 'heatons-honey-collection.ics';
    document.body.appendChild(a); a.click(); a.remove();
  }
  renderVals() {
    const o = this.order;
    const lines = o ? o.items.map((it) => { const p = HH.product(it.id);
      return p ? { qty: it.qty, name: p.name, total: p.price != null ? HH.money(p.price * it.qty) : '' } : null; }).filter(Boolean) : [];
    return Object.assign({
      hasOrder: !!o, noOrder: !o, lines: lines, postcode: HH.shop.collection.postcode,
      dateLong: o ? HH.dateLong(HH.fromIso(o.date)) : '', slot: o ? HH.slotLabel(o.start) : '',
      addToCalendar: () => this.addToCalendar()
    }, HH.headerVals(null));
  }
}
HH.load().then(() => DC.mount(Component));
</script>
</body>
</html>
